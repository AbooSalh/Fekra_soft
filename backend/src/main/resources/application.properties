spring.application.name=kheirbox-backend

# Database Configuration
spring.datasource.url=jdbc:postgresql://db:5432/kheirbox
spring.datasource.username=kheirbox
spring.datasource.password=kheirbox123
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.format_sql=true

# Server Configuration
server.port=8080
server.error.include-message=always

# JWT Configuration
jwt.secret=kheirbox-secret-key-change-this-in-production-to-a-very-long-secure-random-string
jwt.expiration=86400000

# CORS Configuration
cors.allowed.origins=http://localhost:3000

# Logging
logging.level.com.kheirbox=INFO
logging.level.org.springframework.security=DEBUG
